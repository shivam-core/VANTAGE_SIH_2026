[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vantage-scan"
version = "1.0.0"
description = "Local python scanner for Vantage SIH 2026"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=41.0.0"
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0"
]

[project.scripts]
vantage-scan = "vantage_scan.cli:main"
